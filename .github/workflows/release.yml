name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install '.[dev]' twine
      - name: Verify tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          tag = os.environ.get("RELEASE_TAG", "")
          expected = "v" + version("eid-toolbox")
          if tag and tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match {expected!r}.")
          PY
      - run: python -m pytest
      - run: python examples/discrete_xor.py
      - run: python examples/known_dynamics.py
      - run: python examples/learned_model.py
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/

  publish:
    if: vars.PYPI_PUBLISHING_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eid-toolbox/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
